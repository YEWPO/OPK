name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the Windows installer (users import their own SF2)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install development libraries
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfluidsynth-dev portaudio19-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Cache compiled dependencies
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-win64-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          git clone --branch 2025.06.13 --depth 1 https://github.com/microsoft/vcpkg .vcpkg
          if ($LASTEXITCODE) { throw 'vcpkg clone failed' }
          & ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release --parallel 4
      - name: Test
        run: ctest --preset windows-release
      - name: Stage application
        run: cmake --install build-windows-release --config Release --prefix dist/application
      - name: Verify application has no soundfonts and starts without developer DLLs
        shell: pwsh
        run: |
          $banks = Get-ChildItem dist/application -Recurse -File | Where-Object { $_.Extension -in '.sf2', '.sf3' }
          if ($banks) { throw 'Soundfonts must not be bundled' }
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          try {
            $process = Start-Process ./dist/application/openkeys.exe -ArgumentList '--smoke-test' -PassThru -Wait
            if ($process.ExitCode) { throw "Staged executable failed: $($process.ExitCode)" }
          } finally { $env:PATH = $originalPath }
      - name: Upload application (import tutorial included)
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeysPiano-Windows-x64
          path: dist/application/
      - name: Build installer and ZIP
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_installer)
        run: cpack --config build-windows-release/CPackConfig.cmake -C Release -B dist
      - name: Upload installer and ZIP
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_installer)
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeysPiano-Windows-installer
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
