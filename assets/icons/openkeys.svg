<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>OpenKeys Piano</title>
  <desc>The OKP wordmark above one octave: seven white keys and five black keys in groups of two and three on a dark rounded square.</desc>
  <rect id="background" x="8" y="8" width="240" height="240" rx="40" fill="#111e30"/>
  <text id="wordmark" x="128" y="74" text-anchor="middle"
        font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="3" fill="#f1f3ee">OKP</text>
  <g id="white-keys" fill="#f1f3ee">
    <rect x="28" y="102" width="26" height="130" rx="3"/>
    <rect x="57" y="102" width="26" height="130" rx="3"/>
    <rect x="86" y="102" width="26" height="130" rx="3"/>
    <rect x="115" y="102" width="26" height="130" rx="3"/>
    <rect x="144" y="102" width="26" height="130" rx="3"/>
    <rect x="173" y="102" width="26" height="130" rx="3"/>
    <rect x="202" y="102" width="26" height="130" rx="3"/>
  </g>
  <g id="black-keys" fill="#080f1b">
    <rect x="47.5" y="102" width="16" height="78" rx="2"/>
    <rect x="76.5" y="102" width="16" height="78" rx="2"/>
    <rect x="134.5" y="102" width="16" height="78" rx="2"/>
    <rect x="163.5" y="102" width="16" height="78" rx="2"/>
    <rect x="192.5" y="102" width="16" height="78" rx="2"/>
  </g>
</svg>
